<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMOK3 NIC - Catálogo Oficial</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f32;
      --text-color: #ffffff;
      --text-secondary: #94a3b8;
      --accent-color: #00f2fe;
      --accent-hover: #4facfe;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 12px 100px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    header .logo-placeholder {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0b0f19;
      font-size: 1.2rem;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    header h1 span {
      color: var(--accent-color);
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 25px;
      border: 1px solid #2a374e;
      background-color: #111827;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .catalog-grid {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .product-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      border: 1px solid #233047;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .product-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #0d1322;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .product-flavor {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .price-tag {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      gap: 12px;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      background: #0d1322;
      border: 1px solid #2a374e;
      border-radius: 10px;
      overflow: hidden;
    }

    .quantity-selector button {
      background: transparent;
      border: none;
      color: var(--text-color);
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .quantity-selector button:hover {
      background: #1a263e;
    }

    .quantity-selector span {
      width: 32px;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
    }

    .btn-add {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: #0b0f19;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }

    .btn-add:hover {
      opacity: 0.9;
    }

    .btn-disabled {
      background: #334155 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }

    .stock-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .out-of-stock {
      color: var(--danger-color);
      font-weight: bold;
    }

    /* BARRA FLOTANTE DE LA CESTA */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 580px;
      background: #1e293b;
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .cart-bar.hidden {
      display: none;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .cart-summary-items {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .cart-summary-total {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .btn-open-cart {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: #0b0f19;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* MODAL DE LA CESTA Y FORMULARIO */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #111827;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      overflow-y: auto;
      border: 1px solid #1f293d;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 12px;
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: var(--accent-color);
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161f32;
      padding: 12px;
      border-radius: 12px;
    }

    .cart-item-details {
      display: flex;
      flex-direction: column;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .cart-item-sub {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .btn-remove-item {
      background: transparent;
      border: none;
      color: var(--danger-color);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a374e;
      background: #0d1322;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent-color);
    }

    .delivery-note {
      font-size: 0.82rem;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid #f59e0b;
      margin-top: 4px;
    }

    .btn-submit-order {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: #0b0f19;
      font-weight: bold;
      font-size: 1.05rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-placeholder">S</div>
    <h1>SMOK<span>3</span> NIC</h1>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Busca por marca, modelo o sabor..." oninput="filterProducts()">
  </div>

  <div id="catalog" class="catalog-grid">
    <div class="loading-spinner">Cargando catálogo...</div>
  </div>

  <!-- BARRA FLOTANTE DE LA CESTA -->
  <div id="cartBar" class="cart-bar hidden">
    <div class="cart-summary">
      <span id="cartCount" class="cart-summary-items">0 ítems</span>
      <span id="cartTotal" class="cart-summary-total">Total: C\$ 0.00</span>
    </div>
    <button class="btn-open-cart" onclick="openModal()">Ver Cesta 🛒</button>
  </div>

  <!-- MODAL CHECKOUT -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Tu Cesta de Compras</h2>
        <button class="btn-close-modal" onclick="closeModal()">✕</button>
      </div>

      <div id="cartItemsList" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- Lista de productos añadidos -->
      </div>

      <div style="text-align: right; font-size: 1.1rem; font-weight: bold; color: var(--accent-color);">
        Total a pagar: <span id="modalTotal">C\$ 0.00</span>
      </div>

      <hr style="border: 0; border-top: 1px solid #1f293d; margin: 4px 0;">

      <h3 style="font-size: 1.05rem; color: #fff;">📋 Datos para el Pedido</h3>

      <div class="form-group">
        <label for="custName">Nombre Completo *</label>
        <input type="text" id="custName" placeholder="Escribe tu nombre">
      </div>

      <div class="form-group">
        <label for="custPhone">Número de Teléfono / WhatsApp *</label>
        <input type="tel" id="custPhone" placeholder="Ej: 88888888">
      </div>

      <div class="form-group">
        <label for="deliveryOption">Opción de Entrega *</label>
        <select id="deliveryOption" onchange="toggleDeliveryFields()">
          <option value="Plaza El Edén">Punto de Entrega: Plaza El Edén (Gratis)</option>
          <option value="Puente El Paraisito">Punto de Entrega: Puente El Paraisito (Gratis)</option>
          <option value="Delivery">Envío por Delivery a Domicilio</option>
        </select>
      </div>

      <!-- CAMPO UBICACIÓN DELIVERY -->
      <div id="deliveryFields" class="form-group" style="display: none;">
        <label for="custLocation">Ubicación / Dirección Exacta *</label>
        <textarea id="custLocation" rows="2" placeholder="Pega el link de tu ubicación de Google Maps o tu dirección exacta..."></textarea>
        <div class="delivery-note">
          💬 *(Nota: Nos contactaremos en breve para brindarle más información acerca de su envío)*
        </div>
      </div>

      <button class="btn-submit-order" onclick="submitOrder()">Confirmar y Pedir por WhatsApp 🚀</button>
    </div>
  </div>

  <script>
    // Configuración con tus credenciales actualizadas
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZDYvQoK7am_s5dQQcxZ5IZZQZV7YNfGzP-mBOvpjwNnK3C1cO1p_1UrLMZmJxqZgN0Q/exec'; 
    const PHONE_NUMBER = '50576579359'; // Tu número de WhatsApp (+505 76579359)

    let allProducts = [];
    let cart = []; // Estructura: [{ id, nombre, sabor, puffs, precio, cantidad, maxStock }]

    async function fetchCatalog() {
      try {
        const response = await fetch(SCRIPT_URL);
        allProducts = await response.json();
        renderCatalog(allProducts);
      } catch (error) {
        document.getElementById('catalog').innerHTML = `<p style="text-align:center; color:#ef4444;">Error al cargar el catálogo. Intenta de nuevo más tarde.</p>`;
      }
    }

    function renderCatalog(products) {
      const catalogContainer = document.getElementById('catalog');
      catalogContainer.innerHTML = '';

      if (!products || products.length === 0) {
        catalogContainer.innerHTML = `<p style="text-align:center; color:var(--text-secondary);">No hay productos disponibles por el momento.</p>`;
        return;
      }

      products.forEach((product, index) => {
        const stock = parseInt(product.stock) || 0;
        const price = parseFloat(product.precio) || 0;
        const puffs = product.puffs || '';
        const isOutOfStock = stock <= 0;

        const card = document.createElement('div');
        card.className = 'product-card';

        card.innerHTML = `
          <img class="product-img" src="${product.imagen || 'https://via.placeholder.com/400x260?text=SMOK3+NIC'}" alt="${product.nombre}">
          <div class="product-info">
            <div class="product-title">${product.nombre}</div>
            <div class="product-flavor">🍓 Sabor: ${product.sabor || 'Único'} ${puffs ? `| 💨 \${puffs} Puffs` : ''}</div>
            
            <div class="price-tag">C$ ${price.toLocaleString('es-NI', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>

            <div class="stock-info ${isOutOfStock ? 'out-of-stock' : ''}">
              ${isOutOfStock ? '✖ Agotado' : `✔ Stock disponible: \${stock}`}
            </div>

            <div class="controls-row">
              <div class="quantity-selector">
                <button onclick="updateQtyUI(${index}, -1, ${stock})" ${isOutOfStock ? 'disabled' : ''}>-</button>
                <span id="qty-${index}">${isOutOfStock ? 0 : 1}</span>
                <button onclick="updateQtyUI(${index}, 1, ${stock})" ${isOutOfStock ? 'disabled' : ''}>+</button>
              </div>

              ${isOutOfStock ? 
                `<button class="btn-add btn-disabled" disabled>Agotado</button>` : 
                `<button class="btn-add" onclick="addToCart(${index}, '${product.nombre}', '${product.sabor}', '${puffs}', ${price},${stock})">＋ Agregar</button>`
              }
            </div>
          </div>
        `;

        catalogContainer.appendChild(card);
      });
    }

    function updateQtyUI(index, delta, maxStock) {
      const qtySpan = document.getElementById(`qty-${index}`);
      let currentQty = parseInt(qtySpan.innerText) || 1;
      let newQty = currentQty + delta;

      if (newQty >= 1 && newQty <= maxStock) {
        qtySpan.innerText = newQty;
      }
    }

    function addToCart(index, name, flavor, puffs, price, maxStock) {
      const qty = parseInt(document.getElementById(`qty-${index}`).innerText) || 1;
      const itemId = `${name}-${flavor}`;

      const existingIndex = cart.findIndex(item => item.id === itemId);

      if (existingIndex > -1) {
        let newTotalQty = cart[existingIndex].cantidad + qty;
        if (newTotalQty > maxStock) {
          alert(`Lo sentimos, solo hay ${maxStock} unidades disponibles de este sabor.`);
          cart[existingIndex].cantidad = maxStock;
        } else {
          cart[existingIndex].cantidad = newTotalQty;
        }
      } else {
        cart.push({
          id: itemId,
          nombre: name,
          sabor: flavor,
          puffs: puffs,
          precio: price,
          cantidad: qty,
          maxStock: maxStock
        });
      }

      updateCartBar();
    }

    function updateCartBar() {
      const cartBar = document.getElementById('cartBar');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      let totalItems = cart.reduce((sum, item) => sum + item.cantidad, 0);
      let totalPrice = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      if (totalItems > 0) {
        cartCount.innerText = `${totalItems} ítem(s) en tu cesta`;
        cartTotal.innerText = `Total: C$ ${totalPrice.toLocaleString('es-NI', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        cartBar.classList.remove('hidden');
      } else {
        cartBar.classList.add('hidden');
        closeModal();
      }
    }

    function openModal() {
      renderCartModal();
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function renderCartModal() {
      const listContainer = document.getElementById('cartItemsList');
      const modalTotal = document.getElementById('modalTotal');
      listContainer.innerHTML = '';

      let totalPrice = 0;

      cart.forEach((item, idx) => {
        let subtotal = item.precio * item.cantidad;
        totalPrice += subtotal;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="cart-item-details">
            <span class="cart-item-title">${item.nombre}</span>
            <span class="cart-item-sub">🍓 ${item.sabor || 'N/A'} ${item.puffs ? `| 💨 \${item.puffs}` : ''} | x${item.cantidad} - C$ ${subtotal.toLocaleString('es-NI', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
          </div>
          <button class="btn-remove-item" onclick="removeFromCart(${idx})">🗑</button>
        `;
        listContainer.appendChild(div);
      });

      modalTotal.innerText = `C$ ${totalPrice.toLocaleString('es-NI', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartBar();
      renderCartModal();
    }

    function toggleDeliveryFields() {
      const option = document.getElementById('deliveryOption').value;
      const deliveryFields = document.getElementById('deliveryFields');
      if (option === 'Delivery') {
        deliveryFields.style.display = 'flex';
      } else {
        deliveryFields.style.display = 'none';
      }
    }

    function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const deliveryOpt = document.getElementById('deliveryOption').value;
      const location = document.getElementById('custLocation').value.trim();

      if (!name || !phone) {
        alert('Por favor, ingresa tu nombre y número de teléfono.');
        return;
      }

      if (deliveryOpt === 'Delivery' && !location) {
        alert('Por favor, ingresa tu dirección o link de ubicación para el delivery.');
        return;
      }

      let totalPrice = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

      let itemsText = cart.map(i => `🛍️ *Producto:* ${i.nombre}\n🍓 *Sabor:* ${i.sabor || 'N/A'}${i.puffs ? `\n💨 *Puffs:* \${i.puffs}` : ''}\n📦 *Cantidad:* ${i.cantidad}\n💰 *Subtotal:* C$ ${(i.precio * i.cantidad).toLocaleString('es-NI', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`).join('\n\n');

      let deliveryDetail = deliveryOpt;
      if (deliveryOpt === 'Delivery') {
        deliveryDetail = `Delivery\n🏠 *Dirección/Ubicación:* ${location}\n💬 *(Nota: Nos contactaremos en breve para brindarle más información acerca de su envío)*`;
      }

      const message = `¡Hola SMOK3 NIC! 👋 Quiero hacer un pedido:\n\n${itemsText}\n\n💰 *Precio Total:* C$ ${totalPrice.toLocaleString('es-NI', {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n\n👤 *Datos del cliente:*\n• Nombre: ${name}\n• Teléfono: ${phone}\n\n📦 *Método de Entrega:* ${deliveryDetail}`;

      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedMsg}`, '_blank');
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(query)) ||
        (p.sabor && p.sabor.toLowerCase().includes(query))
      );
      renderCatalog(filtered);
    }

    // Inicializar carga
    fetchCatalog();
  </script>
</body>
</html>
